<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120a2a">
<meta name="description" content="Haunted Quest — a 3D Halloween adventure for practising English embedded questions: listening, speaking, spelling and grammar.">
<title>Haunted Quest — Embedded Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff7e8; --muted:#cbb8ee; --bg1:#120a2a; --bg2:#22124a;
  --gold:#ffc83d; --orange:#ff8a1f; --purple:#7b3fe4; --blue:#2f8cff; --green:#3fd27a; --red:#ff4d6d;
  --panel:rgba(26,14,58,.94);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0620;color:var(--ink);font-family:'Mali',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}
.title-font{font-family:'Luckiest Guy','Mali',cursive;letter-spacing:1px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;gap:8px;z-index:5}
.hud-left,.hud-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:auto}
.hud-chip{background:rgba(20,10,45,.78);border:2px solid rgba(255,200,61,.55);border-radius:14px;padding:4px 10px;font-size:15px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.hud-chip.lvl{font-family:'Luckiest Guy',cursive;color:var(--gold);letter-spacing:1px}
.hud-chip b{font-size:17px}
.hud-center{text-align:center;pointer-events:none;flex:1;min-width:0}
#hudObjective{display:inline-block;background:rgba(20,10,45,.78);border-radius:14px;padding:4px 14px;font-size:14px;border:2px solid rgba(160,120,255,.5)}
#hudProgress{margin-top:4px;font-size:13px;color:var(--muted)}
.gems{display:flex;gap:4px;background:rgba(20,10,45,.78);padding:5px 8px;border-radius:14px;border:2px solid rgba(255,200,61,.55)}
.gem{width:18px;height:24px;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:#3a2d5c;opacity:.6}
.gem.on.g1{background:linear-gradient(#bff6ff,#18c8ff);opacity:1;filter:drop-shadow(0 0 6px #4be1ff)}
.gem.on.g2{background:linear-gradient(#f0d4ff,#a64dff);opacity:1}
.gem.on.g3{background:linear-gradient(#ffe7b8,#ff8a1f);opacity:1}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(20,10,45,.85);border:2px solid rgba(255,200,61,.55);font-size:18px}
.icon-btn:active{transform:scale(.92)}

#combo{position:fixed;top:22%;left:50%;transform:translateX(-50%);font-family:'Luckiest Guy',cursive;font-size:56px;color:var(--gold);text-shadow:0 0 18px #ff8a1f,0 4px 0 #6a2b00;z-index:30;pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:translateX(-50%) scale(.3);opacity:0}25%{transform:translateX(-50%) scale(1.25);opacity:1}70%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-40px);opacity:0}}
#prompt{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ff8a1f,#ffc83d);color:#2b1300;font-weight:700;padding:10px 20px;border-radius:30px;box-shadow:0 0 20px rgba(255,170,40,.6);z-index:6;animation:bob 1.2s ease-in-out infinite;cursor:pointer;white-space:nowrap}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
#boo{position:fixed;left:12px;bottom:14px;display:flex;align-items:flex-end;gap:8px;z-index:7;max-width:min(440px,70vw);pointer-events:none}
.boo-face{font-size:40px;filter:drop-shadow(0 0 10px #c8b6ff);animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.boo-text{background:#fff;color:#2a1650;border-radius:16px 16px 16px 4px;padding:9px 13px;font-size:15px;line-height:1.35;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,10,45,.92);border:2px solid var(--gold);padding:8px 18px;border-radius:14px;z-index:40;font-size:15px}

/* touch */
#touch{position:fixed;inset:0;pointer-events:none;z-index:4}
#joy{position:absolute;left:28px;bottom:120px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,200,61,.75)}
#tJump,#tAct{position:absolute;pointer-events:auto;width:78px;height:78px;border-radius:50%;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;line-height:1}
#tJump small,#tAct small{font-size:11px;margin-top:3px}
#tJump{right:24px;bottom:120px;background:rgba(123,63,228,.8);border:3px solid #c8a8ff}
#tAct{right:112px;bottom:70px;background:rgba(255,138,31,.85);border:3px solid #ffd59a}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#screen{background:radial-gradient(ellipse at 50% 20%,rgba(60,30,120,.55),rgba(8,4,24,.9))}
#screen.clear{background:none;pointer-events:none}
#screen.clear>*{pointer-events:auto}
.card{background:var(--panel);border-radius:22px;padding:22px;max-width:780px;width:100%;border:3px solid rgba(255,200,61,.6);box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(123,63,228,.25);position:relative;max-height:calc(100vh - 28px);overflow:auto}
.card.blue{border-color:#46a6ff;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(47,140,255,.3)}
.card.purple{border-color:#b07bff}
.card.orange{border-color:#ffab3d;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(255,138,31,.25)}
h1.logo{font-family:'Luckiest Guy',cursive;font-size:clamp(40px,8vw,74px);margin:0;line-height:.95;text-align:center;background:linear-gradient(#fff6b0,#ffc83d 45%,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a1f00) drop-shadow(0 0 20px rgba(255,140,30,.5))}
.sub-logo{font-family:'Luckiest Guy',cursive;text-align:center;font-size:clamp(20px,4vw,34px);color:#d9ecff;text-shadow:0 3px 0 #1d3f9e;margin:4px 0 6px}
.tagline{text-align:center;color:var(--muted);margin:0 0 14px}
h2{font-family:'Luckiest Guy','Mali',cursive;letter-spacing:1px;margin:0 0 8px;color:var(--gold);font-size:28px}
h3{margin:12px 0 6px;color:#ffd98a}
p{line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.field input{background:#120a2a;border:2px solid #5b3fa6;border-radius:12px;padding:10px 12px;color:#fff;font-size:16px;outline:none}
.field input:focus{border-color:var(--gold)}
.btn{background:linear-gradient(#ffb547,#ff7a1a);color:#2b1300;font-weight:700;font-size:17px;padding:12px 20px;border-radius:14px;box-shadow:0 4px 0 #8a3a00,0 6px 16px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a3a00}
.btn.purple{background:linear-gradient(#b48bff,#7b3fe4);color:#fff;box-shadow:0 4px 0 #3d1a85,0 6px 16px rgba(0,0,0,.4)}
.btn.blue{background:linear-gradient(#6fc1ff,#2f8cff);color:#fff;box-shadow:0 4px 0 #154a9e,0 6px 16px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(#7af0a8,#26b866);color:#06301a;box-shadow:0 4px 0 #0f6b38,0 6px 16px rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.25)}
.btn.small{font-size:14px;padding:8px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.lvl-card{border-radius:16px;padding:12px;text-align:left;color:#fff;position:relative;min-height:118px;border:3px solid transparent}
.lvl-card .ln{font-family:'Luckiest Guy',cursive;font-size:22px;color:var(--gold)}
.lvl-card .lt{font-weight:700}
.lvl-card .ld{font-size:13px;opacity:.85}
.lvl-card .stars{position:absolute;right:10px;top:8px;font-size:15px}
.lvl-card.l1{background:linear-gradient(160deg,#1c4fa8,#0d2456);border-color:#46a6ff}
.lvl-card.l2{background:linear-gradient(160deg,#5a2aa8,#2a1060);border-color:#b07bff}
.lvl-card.l3{background:linear-gradient(160deg,#a8561c,#4f1f08);border-color:#ffab3d}
.lvl-card.locked{filter:grayscale(.8) brightness(.6)}
.lvl-card.locked::after{content:'🔒';position:absolute;right:10px;bottom:8px;font-size:22px}
.feature-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.feature{background:rgba(255,255,255,.06);border-radius:12px;padding:8px;font-size:12.5px;text-align:center}
.feature b{display:block;font-size:20px}
@media (max-width:640px){.menu-grid{grid-template-columns:1fr}.feature-row{grid-template-columns:repeat(2,1fr)}h2{font-size:23px}.card{padding:16px}}

/* question panel */
#qwrap{background:rgba(8,4,24,.55);backdrop-filter:blur(2px)}
#qpanel{width:100%;max-width:760px}
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.q-npc{font-size:44px;filter:drop-shadow(0 0 10px rgba(200,180,255,.8))}
.q-title{flex:1}
.q-title small{color:var(--muted);display:block}
.q-title b{font-size:19px}
.q-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:12px;border-radius:20px;padding:3px 10px;background:rgba(255,255,255,.1)}
.badge.ai{background:linear-gradient(90deg,#7b3fe4,#2f8cff)}
.q-say{background:#fff;color:#2a1650;border-radius:16px;padding:12px 14px;font-size:17px;margin:8px 0;position:relative}
.q-say .en{font-size:20px;font-weight:700}
.q-say .th{font-size:14px;color:#6b5a90}
.q-instr{color:#ffe1a8;font-size:15px;margin:6px 0}
.big-sentence{font-size:22px;font-weight:700;background:#0f0826;border:2px dashed #6c4cc4;border-radius:14px;padding:12px;text-align:center;margin:8px 0;line-height:1.6}
.blank-input{font-size:22px;font-weight:700;width:9em;text-align:center;background:#fff;color:#2a1650;border:3px solid var(--gold);border-radius:10px;padding:2px 6px;outline:none}
.type-input{width:100%;font-size:19px;padding:12px;border-radius:12px;border:3px solid #6c4cc4;background:#fff;color:#2a1650;outline:none}
.type-input:focus{border-color:var(--gold)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;padding:8px;border-radius:14px}
.tiles.answer{background:#0f0826;border:2px dashed #6c4cc4;margin:8px 0}
.tile{background:linear-gradient(#8fd0ff,#2f8cff);color:#fff;font-weight:700;font-size:19px;padding:8px 14px;border-radius:10px;box-shadow:0 4px 0 #154a9e}
.tile.used{opacity:.25;pointer-events:none}
.tile.ans{background:linear-gradient(#ffd27a,#ff9a1f);color:#2b1300;box-shadow:0 4px 0 #8a3a00}
.opts{display:grid;gap:9px;margin:10px 0}
.opt{background:linear-gradient(#3e6fe0,#2a4eb3);color:#fff;padding:12px 16px;border-radius:14px;font-size:18px;font-weight:600;text-align:left;border:3px solid #6fa0ff;box-shadow:0 4px 0 #142a6e}
.opt:active{transform:translateY(2px)}
.opt.right{background:linear-gradient(#5be38f,#24a85a);border-color:#b7ffd2}
.opt.wrong{background:linear-gradient(#ff7b8d,#c22a45);border-color:#ffc0ca;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.feedback{margin-top:10px;border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.5}
.feedback.good{background:rgba(63,210,122,.15);border:2px solid var(--green)}
.feedback.bad{background:rgba(255,77,109,.13);border:2px solid var(--red)}
.feedback.info{background:rgba(47,140,255,.13);border:2px solid var(--blue)}
.words{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.w{padding:3px 8px;border-radius:8px;font-weight:700;font-size:16px}
.w.ok{background:#1f7a46}
.w.miss{background:#a3253b;text-decoration:line-through}
.w.extra{background:#6b5a20}
.meter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.meter>div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px}
.meter .lbl{font-size:13px;color:var(--muted)}
.meter .val{font-size:24px;font-weight:700}
.bar{height:10px;background:#2b1d55;border-radius:6px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ffc83d,#3fd27a)}
.mic-btn{width:86px;height:86px;border-radius:50%;font-size:38px;background:radial-gradient(#ff8fa3,#e0244b);box-shadow:0 0 0 6px rgba(255,77,109,.25),0 6px 18px rgba(0,0,0,.5)}
.mic-btn.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(255,77,109,.1),0 6px 18px rgba(0,0,0,.5)}}
.live{min-height:28px;font-size:18px;color:#bff6ff;font-style:italic;text-align:center}
.speak-zone{display:flex;align-items:center;gap:14px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.hint-line{font-size:13px;color:var(--muted)}
kbd{background:#2b1d55;border-radius:6px;padding:1px 7px;border:1px solid #6c4cc4;font-family:inherit}
.rule{background:rgba(255,255,255,.05);border-left:5px solid var(--gold);border-radius:10px;padding:10px 12px;margin:8px 0}
.rule .ok{color:#7af0a8}.rule .no{color:#ff9aab;text-decoration:line-through}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:6px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
table.t th{color:var(--gold)}
.stars-big{font-size:48px;text-align:center;letter-spacing:6px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shop-item{background:rgba(255,255,255,.06);border-radius:14px;padding:10px;text-align:center;border:2px solid transparent}
.shop-item.on{border-color:var(--gold)}
.swatch{width:46px;height:46px;border-radius:50%;margin:4px auto;border:3px solid #fff}
.cert{background:linear-gradient(135deg,#3a1d6e,#1a0d3a);border:4px double var(--gold);border-radius:18px;padding:18px;text-align:center}
.close-x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);font-size:18px}

/* loading */
#loading{background:rgba(8,4,24,.8);flex-direction:column;z-index:50}
.cauldron-load{position:relative;width:120px;height:110px}
.pot{position:absolute;bottom:0;left:10px;width:100px;height:70px;background:#1b1530;border-radius:0 0 50px 50px;border-top:10px solid #7b3fe4;box-shadow:0 0 30px #a64dff}
.bubble{position:absolute;width:16px;height:16px;border-radius:50%;background:#c79bff;bottom:60px;animation:rise 1.4s infinite ease-in}
.b1{left:30px}.b2{left:56px;animation-delay:.45s}.b3{left:80px;animation-delay:.9s}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-60px) scale(1.2);opacity:0}}
#loadingText{font-size:18px;margin-top:14px}
.q-title{padding-right:40px}
@media (max-width:700px){
  #hud{flex-wrap:wrap;padding:8px}
  .hud-center{order:3;flex-basis:100%}
  .hud-chip{font-size:13px;padding:3px 8px}
  .icon-btn{width:34px;height:34px;font-size:16px}
  #hudObjective{font-size:13px}
  #prompt{bottom:210px;font-size:14px}
  #boo{bottom:230px}
  .q-npc{font-size:34px}
}

/* ===== Responsive: phones, tablets, desktop ===== */
html,body{height:100%;height:100dvh;overscroll-behavior:none;touch-action:manipulation}
button{touch-action:manipulation}
#hud{padding-top:max(10px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
#boo{left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom))}
#joy{left:max(28px,env(safe-area-inset-left))}
#tJump{right:max(24px,env(safe-area-inset-right))}
.overlay{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.card{max-height:calc(100dvh - 28px)}
.btn-row{flex:0 0 auto;align-items:center}
.btn-row>.btn{flex:1 1 auto}
.btn-row>#bChk,.btn-row>#tChk,.btn-row>#oChk{flex:0 0 auto;min-width:110px}
.input-row{flex-wrap:nowrap}
.input-row>input{flex:1;min-width:0}
.input-row>.btn{flex:0 0 auto}
.name-row .f-cls{max-width:130px}.name-row .f-no{max-width:100px}
.ai-toggle{flex:1.4;font-size:14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.ai-toggle input{width:20px;height:20px;flex:0 0 auto}
.menu-row>.btn{flex:1 1 160px}
@media (hover:hover){.btn:hover,.opt:hover,.tile:hover{filter:brightness(1.08)}}
/* tablets */
@media (min-width:701px) and (max-width:1100px) and (pointer:coarse){
  #joy{width:140px;height:140px;bottom:60px}#joyKnob{left:42px;top:42px;width:56px;height:56px}
  #tJump{bottom:60px;width:90px;height:90px}#tAct{bottom:40px;right:130px;width:90px;height:90px}
  #prompt{bottom:180px}#boo{bottom:max(200px,env(safe-area-inset-bottom))}
  .opt{font-size:19px;padding:14px 18px}.tile{font-size:20px;padding:10px 16px}
}
/* phones (portrait) */
@media (max-width:700px){
  .name-row{flex-wrap:wrap}.name-row .field:first-child{flex-basis:100%}
  .name-row .f-cls,.name-row .f-no{max-width:none}
  .start-row{flex-direction:column;align-items:stretch!important}
  .ai-toggle{justify-content:center}
  .big-sentence{font-size:18px;padding:10px}.blank-input{font-size:18px;width:7em}
  .q-say .en{font-size:17px}.q-say{font-size:15px}
  .opt{font-size:16px;padding:11px 13px}.tile{font-size:17px;padding:7px 11px}
  .mic-btn{width:72px;height:72px;font-size:32px}
  .meter{grid-template-columns:1fr}
  .stars-big{font-size:38px}
  #boo{bottom:max(215px,env(safe-area-inset-bottom));max-width:80vw}
}
/* phones in landscape / short screens */
@media (max-height:520px){
  #hud{padding-top:max(6px,env(safe-area-inset-top))}
  .hud-chip{font-size:12px;padding:2px 7px}.hud-chip b{font-size:14px}.icon-btn{width:32px;height:32px;font-size:15px}
  #hudObjective{font-size:12px;padding:3px 10px}#hudProgress{font-size:11px}
  #joy{width:96px;height:96px;bottom:max(16px,env(safe-area-inset-bottom))}#joyKnob{left:26px;top:26px;width:44px;height:44px}
  #tJump{width:64px;height:64px;font-size:22px;bottom:max(86px,env(safe-area-inset-bottom))}
  #tAct{width:64px;height:64px;font-size:22px;bottom:max(12px,env(safe-area-inset-bottom));right:max(24px,env(safe-area-inset-right))}
  #prompt{bottom:max(16px,env(safe-area-inset-bottom));font-size:13px;padding:8px 14px}
  #boo{bottom:auto;top:58px;max-width:45vw}.boo-face{font-size:28px}.boo-text{font-size:13px;padding:6px 10px}
  .card{padding:12px 14px;border-radius:16px}
  h1.logo{font-size:38px}.sub-logo{font-size:20px}.tagline{margin-bottom:6px;font-size:13px}
  .feature-row{display:none}
  .lvl-card{min-height:auto;padding:8px}
  .big-sentence{margin:4px 0;padding:8px}.q-say{margin:4px 0;padding:8px 12px}
  .mic-btn{width:60px;height:60px;font-size:26px}

/* =========================================================
   TASK GENERATION (local procedural "spell book")
   ========================================================= */
function takeFrom(pool, filter) {
  const i = pool.findIndex(filter || (() => true));
  if (i >= 0) return pool.splice(i, 1)[0];
  const cand = BANK.filter(b => !filter || filter(prepItem(b)));
  return prepItem(pick(cand.length ? cand : BANK));
}
function genLevelTasks(level, items) {
  const pool = shuffle(items);
  const T = [];
  const anyFrame = () => Math.random() < .55 ? pick(Q_FRAMES) : pick(S_FRAMES);
  const conj = () => pick(['if', 'whether']);
  if (level === 1) {
    const plan = shuffle(['repeat', 'transform', 'transform-yn', 'repeat', 'transform']);
    plan.forEach(p => {
      const yn = p === 'transform-yn';
      const x = takeFrom(pool, yn ? (i => i.yn) : (i => !i.yn && !i.subj));
      const frame = anyFrame(), c = conj();
      if (p === 'repeat') T.push({ type: 'speak', mode: 'repeat', x, frame, target: sentence(x, frame, c) });
      else T.push({ type: 'speak', mode: 'transform', x, frame, target: sentence(x, frame, 'if') });
    });
  } else if (level === 2) {
    // blank (wh/if), dictation, type x2, order x2
    let x = takeFrom(pool); let f = anyFrame(), c = conj();
    const full = sentence(x, f, c), key = x.yn ? c : x.wh;
    T.push({ type: 'blank', x, frame: f, full, answer: key, accept: x.yn ? ['if', 'whether'] : [key], mode: 'word' });
    x = takeFrom(pool); f = anyFrame(); c = conj();
    const full2 = sentence(x, f, c);
    const words = full2.replace(/[?.]/g, '').split(' ');
    const cands = words.filter(w => /^[a-z]+$/i.test(w) && w.length >= 5 && !Q_FRAMES.concat(S_FRAMES).join(' ').toLowerCase().split(' ').includes(w.toLowerCase()));
    const long = cands.sort((a, b) => b.length - a.length)[0] || words[words.length - 1];
    T.push({ type: 'blank', x, frame: f, full: full2, answer: long, accept: [long.toLowerCase()], mode: 'dictation' });
    for (let k = 0; k < 2; k++) {
      x = takeFrom(pool, i => k === 1 ? i.yn : !i.yn); f = k === 0 ? pick(Q_FRAMES) : pick(S_FRAMES);
      T.push({ type: 'type', x, frame: f, target: sentence(x, f, 'if') });
    }
    for (let k = 0; k < 2; k++) {
      x = takeFrom(pool); f = anyFrame(); c = conj();
      const tgt = sentence(x, f, c);
      const toks = tgt.replace(/([?.])$/, ' $1').split(' ');
      let sh = shuffle(toks), guard = 0; while (sh.join(' ') === toks.join(' ') && guard++ < 10) sh = shuffle(toks);
      T.push({ type: 'order', x, frame: f, target: tgt, toks, shuffled: sh });
    }
    T.splice(0, T.length, ...[T[0], T[2], T[4], T[1], T[3], T[5]]);
  } else {
    // mcq x2, fix x2, dialog x2
    for (let k = 0; k < 2; k++) {
      const x = takeFrom(pool, i => k === 1 ? i.yn : !i.yn); const f = anyFrame(), c = conj();
      const full = sentence(x, f, c), key = x.yn ? c : x.wh;
      const blanked = f + ' ____ ' + (x.yn ? x.e : x.e.split(' ').slice(1).join(' ')) + (isQFrame(f) ? '?' : '.');
      let dist = x.yn ? shuffle(['where', 'what', 'why', 'when', 'how']).slice(0, 3)
        : shuffle(WH_WORDS.filter(w => w !== x.wh && !(x.wh === 'what' && w === 'which') && !(x.wh === 'which' && w === 'what'))).slice(0, 2).concat(['that']);
      const opts = shuffle([key].concat(dist));
      T.push({ type: 'mcq', x, frame: f, full, blanked, opts, answer: key });
    }
    for (let k = 0; k < 2; k++) {
      const x = takeFrom(pool, i => !i.subj && (k === 1 ? i.yn : !i.yn)); const f = k === 0 ? pick(Q_FRAMES) : pick(S_FRAMES);
      const right = sentence(x, f, 'if');
      const badPunct = f + ' ' + embed(x, 'if') + (isQFrame(f) ? '.' : '?');
      const badWord = x.yn ? f + ' ' + (x.wrong.replace(/^if /, 'whether ')) + (isQFrame(f) ? '?' : '.') : f + ' ' + pick(WH_WORDS.filter(w => w !== x.wh && w !== 'whose' && w !== 'which')) + ' ' + x.e.split(' ').slice(x.wh === 'what' && x.e.startsWith('what time') ? 2 : 1).join(' ') + (isQFrame(f) ? '?' : '.');
      const opts = shuffle([right, badPunct, badWord]);
      T.push({ type: 'fix', x, frame: f, wrong: wrongSentence(x, f), opts, answer: right });
    }
    const npcLines = [
      "Who dares to enter my chamber? Ask me properly, little witch!",
      "Hmm... a young apprentice. What do you wish to know?",
      "Speak politely, and maybe I will help you.",
      "My potion is almost ready. Do you have a question for me?"
    ];
    const replies = ["Such a polite question! The answer is in my spell book.", "Well asked! You may add the next ingredient.", "Perfect English! The cauldron glows brighter.", "Excellent! I will tell you everything."];
    for (let k = 0; k < 2; k++) {
      const x = takeFrom(pool, i => !i.subj && (k === 1 ? i.yn : !i.yn));
      const f = pick(['Excuse me, could you tell me', 'Excuse me, do you know', 'Sorry, can you tell me']);
      const right = f + ' ' + embed(x, 'if') + '?';
      const bad1 = f + ' ' + x.wrong + '?';
      const bad2 = x.yn ? f + ' ' + x.dl + '?' : 'Tell me ' + x.dl + '!';
      T.push({ type: 'dialog', x, frame: f, npc: npcLines[k * 2 + Math.floor(Math.random() * 2)], opts: shuffle([right, bad1, bad2]), answer: right, reply: pick(replies) });
    }
  }
  T.forEach(t => { t.attempts = 0; t.solved = false; });
  return T;
}

/* =========================================================
   AI GENERATION (Claude via the page's "sample" capability)
   ========================================================= */
const AI_LOG = { used: false, lastError: '' };
function validAI(it) {
  if (!it || typeof it.d !== 'string' || typeof it.e !== 'string') return false;
  const d = it.d.trim(), e = it.e.trim().replace(/[.]+$/, '');
  if (!/\?$/.test(d) || /\?/.test(e)) return false;
  const dw = d.split(/\s+/).length; if (dw < 3 || dw > 12) return false;
  const yn = !!it.yn;
  const first = d.split(' ')[0].toLowerCase();
  if (yn) {
    if (!['is', 'are', 'was', 'were', 'do', 'does', 'did', 'can', 'could', 'will', 'would', 'should', 'has', 'have', 'may'].includes(first)) return false;
    if (/^(if|whether)\b/i.test(e)) return false;
  } else {
    if (!WH_WORDS.includes(first)) return false;
    if (e.split(' ')[0].toLowerCase() !== first) return false;
  }
  const p = prepItem({ d, e, yn });
  if (p.subj) return false;
  if (/\b(you|i)\b/i.test(d)) return false;
  return true;
}
async function aiGenerateItems(level, timeoutMs = 25000) {
  const sample = await getCap('sample');
  if (!sample) { AI_LOG.lastError = 'unavailable'; return null; }
  const theme = ['a haunted forest with lost ghosts, owls and glowing mushrooms', 'a spooky castle with gates, towers, bats and portraits', "a witch's chamber with potions, a cauldron, spell books and a black cat"][level - 1];
  const prompt = `You write practice items for Thai Grade 11 (Mathayom 5) students learning English EMBEDDED QUESTIONS in a Halloween adventure game. Setting for this level: ${theme}.
Return ONLY JSON of the form {"items":[ ... ]} with exactly 12 items. Each item:
{"d": a direct question, "e": the same question as an embedded clause (start lowercase, normal statement word order, no question mark, do/does/did removed and the main verb conjugated for tense/person), "yn": true for a yes/no question else false}
Rules:
- 8 wh-questions (mix where/why/what/when/how/which/whose and tenses: present simple, past simple, present continuous, can/will/should, verb to be) and 4 yes/no questions.
- For yes/no items "e" must NOT contain if/whether (the game adds it).
- No subject questions (where the wh-word is the subject, e.g. "Who opened the door?").
- Do not use the words "you" or "I". 4–9 words per question, CEFR B1, spooky but friendly.
Examples:
{"d":"Where does the old witch live?","e":"where the old witch lives","yn":false}
{"d":"Why are the bats flying?","e":"why the bats are flying","yn":false}
{"d":"Did he pass the exam?","e":"he passed the exam","yn":true}
Variety seed: ${Math.random().toString(36).slice(2, 8)}`;
  try {
    let val;
    if (typeof sample.json === 'function') val = await withTimeout(sample.json(prompt, { modelTier: 'quick', cache: false }), timeoutMs);
    else { const r = await withTimeout(sample(prompt, { modelTier: 'quick', cache: false }), timeoutMs); val = JSON.parse((r.text.match(/\{[\s\S]*\}/) || ['{}'])[0]); }
    const arr = (val && Array.isArray(val.items)) ? val.items : (Array.isArray(val) ? val : []);
    const good = arr.filter(validAI).map(it => prepItem({ d: it.d.trim(), e: it.e.trim(), yn: !!it.yn }, 'ai'));
    if (good.length < 6) { AI_LOG.lastError = 'too few valid'; return null; }
    AI_LOG.used = true;
    return good;
  } catch (e) { AI_LOG.lastError = (e && (e.code || e.message)) || 'error'; return null; }
}
async function buildTasksForLevel(level, useAI) {
  let items = null;
  if (useAI) items = await aiGenerateItems(level);
  const bank = BANK.map(b => prepItem(b));
  let src = 'bank';
  let pool;
  if (items && items.length) {
    src = 'ai';
    // ensure enough yes/no and wh variety by topping up from bank
    const yn = items.filter(i => i.yn).length;
    pool = items.concat(shuffle(bank.filter(b => yn < 3 ? b.yn : !b.yn)).slice(0, 3));
  } else pool = bank;
  return { tasks: genLevelTasks(level, pool), src };
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') { if (e.key === 'Escape') closeQuestion(); return; }
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); jumpQueued = true; }
  if (e.code === 'KeyE' || e.code === 'Enter') interact();
  if (e.code === 'Escape') { if (G.state === 'question') closeQuestion(); else if (G.state === 'play') pauseMenu(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; try { cv.setPointerCapture(e.pointerId); } catch (_) { } });
  cv.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId) return; camYaw -= (e.clientX - drag.x) * .006; camPitch = clamp(camPitch + (e.clientY - drag.y) * .003, .12, .95); drag.x = e.clientX; drag.y = e.clientY; });
  const end = () => { drag = null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => { camDist = clamp(camDist + e.deltaY * .005, 4, 10); }, { passive: true });
  const jz = $('#joy'), kn = $('#joyKnob');
  const jmove = e => { const r = jz.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy), m = 45; if (d > m) { dx *= m / d; dy *= m / d; } joy.x = dx / m; joy.y = -dy / m; kn.style.transform = `translate(${dx}px,${dy}px)`; };
  jz.addEventListener('pointerdown', e => { joy.active = true; try { jz.setPointerCapture(e.pointerId); } catch (_) { } jmove(e); });
  jz.addEventListener('pointermove', e => { if (joy.active) jmove(e); });
  const jend = () => { joy.active = false; joy.x = joy.y = 0; kn.style.transform = ''; };
  jz.addEventListener('pointerup', jend); jz.addEventListener('pointercancel', jend);

  $('#tAct').addEventListener('pointerdown', e => { e.preventDefault(); interact(); });

}

}

/* ---------- physics ---------- */
function resolveCollisions() {

  ix += joy.x; iz += joy.y;

  jumpQueued = false;

}
function updateCompanions(dt, t, still) {
  const c = Math.cos(P.face), s = Math.sin(P.face);
  const off = (x, z) => new V3(P.pos.x + x * c + z * s, 0, P.pos.z - x * s + z * c);

function updateCamera(dt, title) {
  const tgt = title ? new V3(0, 2, G.L && G.L.round ? 0 : -16) : new V3(P.pos.x, P.pos.y * .6 + 1.3, P.pos.z);

  if (title) { yaw = performance.now() * .00008; pit = .25; dist = 16; }
  const des = new V3(tgt.x + Math.sin(yaw) * Math.cos(pit) * dist, tgt.y + Math.sin(pit) * dist, tgt.z + Math.cos(yaw) * Math.cos(pit) * dist);
  if (G.level === 2 && !title) des.x = clamp(des.x, -6.9, 6.9);
  if (G.L && G.L.round) { const d = Math.hypot(des.x, des.z), m = 17; if (d > m) { des.x *= m / d; des.z *= m / d; } }
  camera.position.lerp(des, 1 - Math.exp(-dt * (title ? 1.5 : 7)));

/* ---------- world update ---------- */
function updateWorld(dt, t) {
  const L = G.L; if (!L) return;
  torches.forEach(o => { const k = 1 + Math.sin(t * 15 + o.ph) * .12 + Math.sin(t * 23 + o.ph) * .08; o.f.scale.set(1, k, 1); o.gl.material.opacity = .55 + (k - 1) * 1.5; });
  updateFireflies(t); updateBursts(dt);
  L.traps.forEach(tr => { tr.update(t); if (G.state === 'play' && tr.hit(P.pos)) hurt(); });
  L.coins.forEach(c => {
    if (c.taken) { if (c.g.visible) { c.g.position.y += dt * 4; c.g.scale.multiplyScalar(.9); if (c.g.scale.x < .05) c.g.visible = false; } return; }
    c.g.rotation.y += dt * 3;
    if (G.state === 'play' && Math.hypot(P.pos.x - c.g.position.x, P.pos.z - c.g.position.z) < .9 && Math.abs(P.pos.y + .8 - c.g.position.y) < 1.3) {
      c.taken = true; SAVE.coins++; G.coinsRun++; G.score += 10; SFX.coin(); updateHUD();
    }
  });
  L.stations.forEach((s, i) => {
    const npc = s.npc;
    if (s.kind === 'ghost' || s.kind === 'mirror') {
      if (s.freed) { npc.g.position.y += dt * 1.6; npc.g.rotation.y += dt * 4; npc.mat.opacity = Math.max(0, npc.mat.opacity - dt * .25); if (npc.mat.opacity <= 0) npc.g.visible = false; }
      else if (s.kind === 'ghost') { npc.g.position.y = .6 + Math.sin(t * 2 + i) * .13; const d = Math.hypot(P.pos.x - s.pos.x, P.pos.z - s.pos.z); if (d < 8) npc.g.rotation.y = lerpAngle(npc.g.rotation.y, Math.atan2(P.pos.x - s.pos.x, P.pos.z - s.pos.z), dt * 4); }
      else npc.g.position.y = 1.3 + Math.sin(t * 2) * .08;
    } else if (s.kind === 'pedestal') {
      if (!s.flying) { npc.bottle.position.y = 1.1 + Math.sin(t * 2 + i) * .08; npc.bottle.rotation.y += dt; }
    } else if (s.kind === 'witch') {
      animWitch(npc, { mode: s.solved ? 'celebrate' : 'idle', timer: t }, t, dt);
      if (!s.solved) npc.g.rotation.y = lerpAngle(npc.g.rotation.y, Math.atan2(P.pos.x - s.pos.x, P.pos.z - s.pos.z), dt * 2);
    }
    if (s.marker) { s.marker.position.y = (s.kind === 'witch' ? 3.4 : s.kind === 'mirror' ? 3.6 : 2.5) + Math.sin(t * 3 + i) * .12; }
  });
  // flying bottles to cauldron
  L.stations.forEach(s => {
    if (!s.flying) return; s.flyT += dt / 1.4; const b = s.npc.bottle; const k = Math.min(1, s.flyT);
    const from = s.flyFrom, to = new V3(0, 2.6, 0); const pos = from.clone().lerp(to, k); pos.y += Math.sin(k * Math.PI) * 4;
    b.parent && b.parent !== scene && (scene.attach(b)); b.position.copy(pos); b.rotation.z += dt * 8;
    if (k >= 1) { s.flying = false; b.visible = false; burst(new V3(0, 2.6, 0), s.color, 50, 4); L.cauldron.liquidMat.color.setHex(s.color); L.cauldron.liquidMat.emissive.setHex(s.color); L.cauldron.cl.color.setHex(s.color); L.cauldron.cglow.material.color.setHex(s.color); SFX.coin(); }
  });
  if (L.cauldron) {
    L.cauldron.fire.forEach((f, i) => f.scale.y = 1 + Math.sin(t * 18 + i) * .25);
    if (Math.random() < dt * 6) { const b = mesh(new THREE.SphereGeometry(rand(.06, .14), 8, 6), new THREE.MeshBasicMaterial({ color: L.cauldron.liquidMat.color.clone().offsetHSL(0, 0, .2), transparent: true, opacity: .9 }), rand(-.8, .8), 2.35, rand(-.8, .8), scene, false); L.cauldron.bubbles.push({ b, v: rand(.5, 1.2) }); }
    for (let k = L.cauldron.bubbles.length - 1; k >= 0; k--) { const o = L.cauldron.bubbles[k]; o.b.position.y += o.v * dt; o.b.material.opacity -= dt * .8; if (o.b.material.opacity <= 0) { scene.remove(o.b); o.b.geometry.dispose(); L.cauldron.bubbles.splice(k, 1); } }
  }
  if (L.gates) L.gates.forEach(g => { if (g.open && g.openT < 1) { g.openT = Math.min(1, g.openT + dt / 1.6); g.bars.position.y = g.openT * 5.8; } });
  if (L.door && L.door.open && L.door.openT < 1) { L.door.openT = Math.min(1, L.door.openT + dt / 2); L.door.leaves[0].rotation.y = L.door.openT * 1.6; L.door.leaves[1].rotation.y = -L.door.openT * 1.6; }
  // gem
  if (G.gemObj && !G.gemTaken) {
    const gm = G.gemObj; gm.rotation.y += dt * 2;
    if (gm.userData.rise != null && gm.userData.rise < 1) { gm.userData.rise = Math.min(1, gm.userData.rise + dt / 2); gm.position.lerpVectors(gm.userData.from, L.gemPos, gm.userData.rise); }
    else gm.position.y = L.gemPos.y + Math.sin(t * 2) * .2;
    if (G.state === 'play' && Math.hypot(P.pos.x - gm.position.x, P.pos.z - gm.position.z) < 1.3) collectGem();
  }
  if (G.level === 3 && G.finaleReady && G.state === 'play' && Math.hypot(P.pos.x, P.pos.z + 16) < 2.2) finale();
  // proximity prompt
  if (G.state === 'play') {
    const s = nearestStation(); const pr = $('#prompt');
    if (s) { pr.innerHTML = `${isTouch ? '✋ Tap' : '<kbd>E</kbd>'} Talk to ${esc(s.name)}`; pr.classList.remove('hidden'); } else pr.classList.add('hidden');
  }
}

/* ---------- station solved & level end ---------- */
function stationSolved(s) {
  s.solved = true; const L = G.L;
  if (s.marker) { scene.remove(s.marker); s.marker = textSprite('✓', { bg: '#26b866', color: '#fff', size: 150, scale: .8 }); s.marker.position.copy(s.pos).add(new V3(0, 2.5, 0)); scene.add(s.marker); }
  burst(s.pos.clone().add(new V3(0, 1.2, 0)), G.level === 1 ? 0x9ff2ff : G.level === 2 ? 0xd9a8ff : 0xffc070, 60, 5);
  P.anim = { mode: 'celebrate', timer: 1.6 };
  P.checkpoint.copy(s.pos).add(new V3(s.pos.x > 0 ? -1.6 : 1.6, 0, 0));
  if (s.kind === 'ghost' && G.level === 1) { s.freed = true; s.npc.mouth.scale.set(1.4, .5, .4); }
  if (s.kind === 'mirror') s.freed = true;
  if (s.kind === 'pedestal') { s.flying = true; s.flyT = 0; s.flyFrom = s.npc.bottle.getWorldPosition(new V3()); }
  if (L.gates) {
    const gi = Math.floor(s.idx / 2), g = L.gates[gi];
    if (g && !g.open && L.stations[gi * 2].solved && L.stations[gi * 2 + 1].solved) { g.open = true; SFX.door(); burst(new V3(0, 3, g.z), 0xb26bff, 80, 6); booSay(`🔓 Gate ${gi + 1} is open! Keep going!`, 3200); }
  }
  const all = G.tasks.every(t => t.solved);
  if (all && !G.gemSpawned) setTimeout(spawnGem, G.level === 3 ? 1600 : 700);
  else if (!(L.gates && L.gates.some(g => g.open && g.openT === 0))) {
    const left = G.tasks.filter(t => !t.solved).length;
    booSay(pick(['Awesome! ✨', 'Great job! 🎉', 'Amazing! The magic grows stronger 🔮', 'Excellent! 👏']) + ` ${left} task${left > 1 ? 's' : ''} left.`, 3000);
  }
  updateHUD(); persist();
}
function spawnGem() {
  const L = G.L, info = LEVEL_INFO[G.level];
  G.gemSpawned = true; const gm = makeCrystal(info.color); scene.add(gm); G.gemObj = gm;
  if (G.level === 3) { gm.userData.from = new V3(0, 2.6, 0); gm.userData.rise = 0; gm.position.copy(gm.userData.from); burst(new V3(0, 3, 0), 0xffc070, 120, 7); }
  else gm.position.copy(L.gemPos);

}

  P.anim = { mode: 'celebrate', timer: 2.2 }; updateHUD();

    const D = G.L.door; let k = 0;
    const lightOne = () => { const s = D.sockets[k]; s.material = M(s.userData.c, { emissive: s.userData.c, emissiveIntensity: 2 }); glow(s.userData.c, 1.4, D.door, s.position.x, s.position.y, s.position.z + .1, .9); SFX.coin(); k++; if (k < 3) setTimeout(lightOne, 450); else setTimeout(() => { D.open = true; SFX.door(); G.finaleReady = true; booSay('🚪 All 3 crystals! The door to the final magic room is open — walk in!', 6000); updateHUD(); }, 600); };

function computeStars() { const r = G.firstTry / Math.max(1, G.tasks.length); return r >= .85 ? 3 : r >= .6 ? 2 : 1; }
function levelComplete(silent) {
  const n = G.level, info = LEVEL_INFO[n];
  const stars = computeStars(); const lifeBonus = G.lives * 20; G.score += lifeBonus;
  const prev = SAVE.levels[n] || { best: 0, stars: 0, plays: 0 };
  SAVE.levels[n] = { best: Math.max(prev.best, G.score), stars: Math.max(prev.stars, stars), last: G.score, plays: (prev.plays || 0) + 1, firstTry: G.firstTry, tasks: G.tasks.length, bestCombo: Math.max(prev.bestCombo || 0, G.bestStreak), date: Date.now() };

/* ---------- main loop ---------- */
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!G.L) return;
  if (G.state === 'play') updatePlayer(dt, t);
  else if (P.anim.timer > 0) { P.anim.timer -= dt; if (P.anim.timer <= 0) P.anim.mode = 'idle'; }
  if (G.state !== 'play' && P.anim.timer <= 0) P.anim.mode = 'idle';
  if (witch) { animWitch(witch, { mode: P.anim.mode, timer: P.anim.timer }, t, dt); if (G.state !== 'play') { witch.g.visible = true; witch.g.position.copy(P.pos); witch.g.rotation.y = P.face; } }
  if (boo && petObj) updateCompanions(dt, t);
  updateWorld(dt, t);
  updateCamera(dt, G.state === 'title');
  if (G.L && G.L.portal) G.L.portal.userData.swirl.rotation.z += dt;
  renderer.render(scene, camera);
}

/* =========================================================
   QUESTION PANELS (the learning core)
   ========================================================= */
let Q = null; // {s, task}
const SKILL_OF = { speak: 'listen', blank: 'spell', type: 'spell', order: 'spell', mcq: 'gram', fix: 'gram', dialog: 'gram' };

function openQuestion(s) {
  G.state = 'question'; $('#prompt').classList.add('hidden');
  Q = { s, task: s.task };
  $('#qwrap').classList.remove('hidden');
  renderQuestion();
  const tk = s.task;
  if (tk.type === 'speak') playModel();
  if (tk.type === 'dialog') speak(tk.npc, { pitch: .7, rate: .9 });
}
function closeQuestion() {
  if (!Q) return;
  stopListening(); try { speechSynthesis.cancel(); } catch (e) { }
  const s = Q.s, solved = Q.task.solved; Q = null;
  $('#qwrap').classList.add('hidden'); $('#qpanel').innerHTML = '';
  G.state = 'play'; P.invuln = Math.max(P.invuln, 1.2);
  if (solved && !s.solved) stationSolved(s);
  updateHUD();
}
function header(tk) {
  const s = Q.s, i = LEVEL_INFO[G.level], idx = G.tasks.indexOf(tk) + 1;
  const typeName = { speak: tk.mode === 'repeat' ? 'Listen & repeat' : 'Listen → say it as an embedded question', blank: tk.mode === 'dictation' ? 'Listen & spell the missing word' : 'Fill in the blank', type: 'Type the full sentence', order: 'Build the sentence', mcq: 'Choose the right word', fix: 'Fix the word order', dialog: 'Role-play conversation' }[tk.type];
  return `<button class="close-x" id="qClose" title="Leave for now">✕</button>
    <div class="q-head"><div class="q-npc">${s.icon}</div><div class="q-title"><small>Level ${G.level} • Task ${idx}/${G.tasks.length} • ${typeName}</small><b>${esc(s.name)}</b></div></div>
    <div class="q-badges"><span class="badge ${G.src === 'ai' && tk.x.src === 'ai' ? 'ai' : ''}">${G.src === 'ai' && tk.x.src === 'ai' ? '🔮 Created by AI' : '📜 Auto-generated'}</span>
    ${G.streak >= 1 ? `<span class="badge">🔥 ${G.streak} correct in a row</span>` : ''}<span class="badge">Try ${tk.attempts + 1}</span></div>`;
}
function renderQuestion() {
  const tk = Q.task, css = LEVEL_INFO[G.level].css;
  let body = '';
  if (tk.type === 'speak') body = speakBody(tk);
  else if (tk.type === 'blank') body = blankBody(tk);
  else if (tk.type === 'type') body = typeBody(tk);
  else if (tk.type === 'order') body = orderBody(tk);
  else body = choiceBody(tk);
  $('#qpanel').innerHTML = `<div class="card ${css}">${header(tk)}${body}<div id="qfb"></div><div class="q-actions" id="qact"></div></div>`;
  $('#qClose').onclick = closeQuestion;
  bindQuestion(tk);
}

/* ---------- scoring ---------- */
function onCorrect(tk) {
  tk.attempts++; tk.solved = true;
  G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
  const mult = G.streak >= 3 ? 3 : G.streak === 2 ? 2 : 1;
  const base = tk.attempts === 1 ? 100 : tk.attempts === 2 ? 60 : 30;
  const pts = base * mult, coins = 5 + (mult - 1) * 4;
  G.score += pts; SAVE.coins += coins;
  if (tk.attempts === 1) G.firstTry++;
  const sk = SAVE.stats[SKILL_OF[tk.type]];
  if (tk.type !== 'speak' || tk.mode === 'transform') { sk.t++; if (tk.attempts === 1) sk.c++; }
  SFX.correct(); if (mult > 1) { setTimeout(() => { showCombo(mult); SFX.combo(); }, 250); }
  persist(); updateHUD();
  return `<div class="hint-line" style="margin-top:6px">+${pts} points${mult > 1 ? ` (Combo x${mult}!)` : ''} • +${coins} 🪙</div>`;
}
function onWrong(tk, issues) {
  tk.attempts++; G.streak = 0; SFX.wrong();
  (issues || []).forEach(k => { if (SAVE.stats.err[k] != null) SAVE.stats.err[k]++; });
  persist(); updateHUD();
}
function onReveal(tk) {
  tk.solved = true; tk.revealed = true; G.streak = 0;
  const sk = SAVE.stats[SKILL_OF[tk.type]]; if (tk.type !== 'speak' || tk.mode === 'transform') sk.t++;
  persist(); updateHUD();
}
function fb(cls, html) { $('#qfb').innerHTML = `<div class="feedback ${cls}">${html}</div>`; }
function actions(html) { $('#qact').innerHTML = html; }
function continueBtn(label = 'Continue ➜') { actions(`<button class="btn green" id="qNext">${label}</button>`); $('#qNext').onclick = closeQuestion; $('#qNext').focus(); }
function issueHtml(issues, extra = '') { return issues.map(k => ISSUE_TEXT[k] || '').filter(Boolean).join('<br>') + extra; }

/* ---------- SPEAK (Level 1) ---------- */
function playModel(slow) {
  const tk = Q && Q.task; if (!tk) return;
  const txt = tk.mode === 'repeat' ? tk.target : tk.x.d;
  speak(txt, { rate: slow ? .65 : .92, pitch: 1.25 });
}
function askAbout(x) {
  if (x.yn) return 'a <b>yes/no</b> answer';
  const e = x.e.toLowerCase();
  if (e.startsWith('what time')) return 'a <b>time</b>';
  if (e.startsWith('how old')) return 'an <b>age</b>';
  if (e.startsWith('how many') || e.startsWith('how much')) return 'an <b>amount</b>';
  return ({ where: 'a <b>place</b>', why: 'a <b>reason</b>', what: 'a <b>thing</b>', when: 'a <b>time</b>', how: 'a <b>way / method</b>', who: 'a <b>person</b>', which: 'a <b>choice</b>', whose: 'an <b>owner</b>' })[x.wh] || 'information';
}
function speakBody(tk) {
  const say = tk.mode === 'repeat'
    ? `<div class="q-say">👻 “Please help me! Say this sentence with me...”<div class="en">${esc(tk.target)}</div></div>
       <div class="q-instr">🎧 Listen to the model, then tap 🎤 and say the whole sentence clearly.</div>`
    : `<div class="q-say">👻 The ghost asks… <span id="dq" class="en" style="filter:blur(7px);transition:filter .3s">${esc(tk.x.d)}</span><div class="th">(Listen first — tap 👀 if you need to see it.)</div></div>
       <div class="q-instr">🎯 Say this question again as an <b>embedded question</b>, starting with: <b style="color:#fff;font-size:18px">“${esc(tk.frame)} …”</b></div>`;
  const micOK = !!SRClass && !micBlocked;
  return `${say}
    <div class="row btn-row"><button class="btn blue small" id="bPlay">🔊 Model audio</button><button class="btn ghost small" id="bSlow">🐢 Slow</button>${tk.mode === 'transform' ? '<button class="btn ghost small" id="bShow">👀 Show text</button>' : ''}</div>
    <div class="speak-zone">${micOK ? '<button class="mic-btn" id="bMic" title="Tap and speak">🎤</button>' : ''}<div style="flex:1;min-width:200px"><div class="live" id="live">${micOK ? 'Tap 🎤 and speak in English…' : ''}</div></div></div>
    ${micOK ? '' : `<div class="feedback info" id="micNote">🎙️ ${SRClass ? 'The microphone is blocked on this page' : 'This browser does not support speech recognition yet'} — <b>say the sentence out loud</b> and use your <b>keyboard’s microphone button</b> (phone / iPad), <kbd>Win</kbd>+<kbd>H</kbd> (Windows) or press <kbd>fn</kbd> twice (Mac) to turn your voice into text in the box below. For direct microphone checking, open the game from its GitHub Pages link in Chrome, Edge or Safari.</div>`}
    <div class="row input-row" style="margin-top:6px"><input class="type-input" id="spTxt" placeholder="${micOK ? 'Or type / dictate here' : 'Speak (dictate) or type your sentence here'}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn small" id="bSpCheck">Check ✓</button></div>`;
}
function bindSpeak(tk) {
  $('#bPlay').onclick = () => playModel(false);
  $('#bSlow').onclick = () => playModel(true);
  if ($('#bShow')) $('#bShow').onclick = () => { $('#dq').style.filter = 'none'; };
  const mic = $('#bMic');
  if (mic) mic.onclick = async () => {
    if (mic.classList.contains('rec')) { stopListening(); return; }
    try { speechSynthesis.cancel(); } catch (e) { }
    mic.classList.add('rec'); $('#live').textContent = '🎙️ Listening… speak now';
    try {
      const r = await listenOnce(txt => { $('#live').textContent = '“' + txt + '”'; });
      mic.classList.remove('rec');
      if (!r) { $('#live').textContent = 'I didn’t hear anything. Tap 🎤 and try again.'; return; }
      $('#live').textContent = '“' + r.text + '”';
      evaluateSpeech(tk, r.text, r.conf, r.alts, 'mic');
    } catch (err) {
      mic.classList.remove('rec');
      if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture' || err === 'start-failed') {
        micBlocked = true;
        $('#live').innerHTML = '';
        mic.remove();
        $('#qfb').innerHTML = `<div class="feedback info">🎙️ The microphone can’t be used on this page (${esc(err)}) — say the sentence out loud and use your <b>keyboard’s microphone button</b> / <kbd>Win</kbd>+<kbd>H</kbd> to turn it into text in the box below, then tap “Check”.</div>`;
      } else if (err === 'network') { $('#live').textContent = 'Speech recognition needs an internet connection. Try again or type instead.'; }
      else $('#live').textContent = 'Something went wrong (' + err + '). Please try again.';
    }
  };
  const go = () => { const v = $('#spTxt').value.trim(); if (!v) return; evaluateSpeech(tk, v, null, null, 'text'); };
  $('#bSpCheck').onclick = go; $('#spTxt').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function evaluateSpeech(tk, said, conf, alts, source) {
  if (tk.solved) return;
  // choose the recognition alternative closest to the target (the recognizer is unsure between them)
  let best = { text: said, conf };
  if (alts && alts.length > 1) { let ba = -1; alts.forEach(a => { const acc = alignWords(tk.target, a.text).acc; if (acc > ba) { ba = acc; best = { text: a.text, conf: (a.conf || conf) }; } }); }
  const al = alignWords(tk.target, best.text);
  const dg = diagnose(best.text, tk.x, tk.target);
  const structural = dg.issues.filter(k => k === 'order' || k === 'ifw' || k === 'wh');
  const pass = al.acc >= 80 && structural.length === 0;
  const pron = source === 'mic' && best.conf ? clamp(Math.round(best.conf * 5), 1, 5) : null;
  const st = SAVE.stats.speak; st.n++; st.accSum += al.acc; if (pron) { st.pronSum += pron; st.pronN++; } if (pass) st.pass++;
  const chips = `<div class="words">${al.out.map(o => `<span class="w ${o.k}">${esc(o.w)}</span>`).join('')}</div><div class="hint-line">🟩 correct • 🟥 missing / unclear • 🟨 extra word</div>`;
  const meter = `<div class="meter">
     <div><div class="lbl">📝 Sentence accuracy</div><div class="val">${al.acc}%</div><div class="bar"><i style="width:${al.acc}%"></i></div><div class="hint-line">${structural.length ? '⚠️ Word order / structure is not right yet' : '✔ Embedded question structure is correct'}</div></div>
     <div><div class="lbl">🗣️ Pronunciation (estimate)</div><div class="val">${pron ? '★'.repeat(pron) + '☆'.repeat(5 - pron) : '—'}</div><div class="hint-line">${pron ? 'Estimated from the speech recognizer’s confidence — not an exact pronunciation score' : 'No audio data (checked from text) — keep practising with the model audio'}</div></div></div>`;
  const tips = (source === 'mic' ? al.missed : []).map(w => PRON_TIPS[w.toLowerCase()]).filter(Boolean);
  const tipHtml = tips.length ? `<div style="margin-top:6px">🔈 <b>Words the system didn’t catch — maybe unclear:</b><br>${[...new Set(tips)].slice(0, 3).map(t => '• ' + esc(t)).join('<br>')}</div>` : (source === 'mic' && al.missed.length ? `<div style="margin-top:6px">🔈 Practise saying <b>${al.missed.slice(0, 4).map(esc).join(', ')}</b> more clearly, then try again.</div>` : '');
  if (pass) {
    if (tk.mode === 'transform' && tk.attempts === 0) { /* listening success counted in onCorrect */ }
    const pts = onCorrect(tk);
    fb('good', `🎉 <b>${pick(['Excellent!', 'Great speaking!', 'Perfect!', 'Well done!'])}</b> The ghost understands you!${chips}${meter}${tipHtml}${pts}<div style="margin-top:6px">${ruleFor(tk.x)}</div>`);
    continueBtn('Free the ghost ✨');
  } else {
    onWrong(tk, structural.length ? structural : (al.acc < 80 ? ['other'] : []));
    const msg = structural.length ? issueHtml(structural) : '👻 Some words are missing. Listen to the model again and speak more clearly (you need 80% or more).';
    const reveal = tk.attempts >= 2 ? `<div style="margin-top:8px">💡 <b>Model sentence:</b> <span style="font-size:18px">${esc(tk.target)}</span> <button class="btn blue small" id="bHear">🔊 Listen</button></div>` : '';
    fb('bad', `${msg}${chips}${meter}${tipHtml}${reveal}`);
    if ($('#bHear')) $('#bHear').onclick = () => speak(tk.target, { rate: .8, pitch: 1.2 });
    actions(tk.attempts >= 3 ? `<button class="btn ghost small" id="bSkip">Skip for now (0 points)</button>` : '');
    if ($('#bSkip')) $('#bSkip').onclick = () => { onReveal(tk); closeQuestion(); };
  }
}

/* ---------- BLANK (Level 2) ---------- */
function blankBody(tk) {
  const f = tk.full, i = f.toLowerCase().indexOf(tk.answer.toLowerCase(), tk.frame.length);
  const before = f.slice(0, i), after = f.slice(i + tk.answer.length);
  const len = tk.answer.length;
  const instr = tk.mode === 'dictation'
    ? `🎧 Listen to the sentence, then <b>type the missing word</b> with the correct spelling (${len} letters).`
    : `✍️ Type the missing word. Hint: the hidden question asks for ${askAbout(tk.x)}.`;
  return `<div class="q-say">👻 “Spell it right and the lock will open!”</div>
    <div class="q-instr">${instr}</div>
    <div class="big-sentence">${esc(before)}<input class="blank-input" id="bIn" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${'_ '.repeat(len).trim()}">${esc(after)}</div>
    <div class="row btn-row"><button class="btn blue small" id="bHearS">🔊 Hear sentence</button>${tk.mode === 'dictation' ? '<button class="btn ghost small" id="bHearW">🔊 Hear the word</button>' : ''}<button class="btn small" id="bChk">Check ✓</button></div>
    <p class="hint-line" id="bHint"></p>`;
}
function bindBlank(tk) {
  $('#bHearS').onclick = () => speak(tk.full, { rate: .85 });
  if ($('#bHearW')) $('#bHearW').onclick = () => speak(tk.answer, { rate: .7 });
  const inp = $('#bIn'); if (!isTouch) setTimeout(() => inp.focus(), 80);
  const go = () => {
    if (tk.solved) return;
    const v = inp.value.trim().toLowerCase(); if (!v) return;
    if (tk.accept.includes(v)) {
      inp.style.borderColor = '#3fd27a'; inp.disabled = true;
      const pts = onCorrect(tk);
      fb('good', `🎉 Correct! <b>${esc(tk.full)}</b>${pts}<div style="margin-top:6px">${tk.mode === 'word' ? ruleFor(tk.x) : `📝 Spelling: <b>${tk.answer.split('').join('-')}</b>`}</div>`);
      speak(tk.full, { rate: .9 }); continueBtn('Unlock 🔓');
    } else {
      const d = Math.min(...tk.accept.map(a => lev(v, a)));
      const near = d <= 2 && v.length > 2;
      const issues = near ? ['spell'] : (tk.mode === 'word' ? [tk.x.yn ? 'ifw' : 'wh'] : ['spell']);
      onWrong(tk, issues);
      inp.style.borderColor = '#ff4d6d';
      let hint = near ? `👻 So close! ${d} letter${d > 1 ? 's are' : ' is'} wrong. Check the spelling again.` : issueHtml(issues);
      if (tk.attempts >= 1) $('#bHint').innerHTML = `💡 Hint: it starts with “<b>${tk.answer[0]}</b>” and has ${tk.answer.length} letters.`;
      if (tk.attempts >= 3) hint += `<br>📖 Answer: <b>${esc(tk.answer)}</b> — type it to continue.`;
      fb('bad', hint);
    }
  };
  $('#bChk').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ---------- TYPE SENTENCE (Level 2) ---------- */
function typeBody(tk) {
  return `<div class="q-say">👻 “Write the magic words <i>exactly</i> right — capital letters and punctuation too!”</div>
    <div class="q-instr">✍️ Change this question into an embedded question and <b>type the whole sentence</b> (capital letter + correct end mark).</div>
    <div class="big-sentence" style="font-size:19px">❓ ${esc(tk.x.d)}<br>➜ Start with: <span style="color:#ffc83d">${esc(tk.frame)} …</span></div>
    <input class="type-input" id="tIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the full sentence here">
    <div class="row btn-row" style="margin-top:8px"><button class="btn small" id="tChk">Check ✓</button></div>`;
}
function bindType(tk) {
  const inp = $('#tIn'); if (!isTouch) setTimeout(() => inp.focus(), 80);
  const go = () => {
    if (tk.solved) return;
    const v = inp.value.trim().replace(/\s+/g, ' ').replace(/[’‘]/g, "'"); if (!v) return;
    const contentOK = canon(v) === canon(tk.target);
    if (contentOK) {
      const capsOK = /^[A-Z]/.test(v) && !/\bi\b/.test(v.replace(/^I\b/, ''));
      const endOK = v.slice(-1) === tk.target.slice(-1);
      if (capsOK && endOK) {
        const pts = onCorrect(tk); inp.disabled = true; inp.style.borderColor = '#3fd27a';
        fb('good', `🎉 Perfect! <b>${esc(v)}</b>${pts}<div style="margin-top:6px">${ruleFor(tk.x)}<br>✒️ ${punctRule(tk.frame)}</div>`);
        continueBtn('Unlock 🔓');
      } else {
        const iss = []; if (!capsOK) iss.push('caps'); if (!endOK) iss.push('punct');
        onWrong(tk, iss);
        fb('bad', `✅ Your word order and spelling are correct! But you still need to fix:<br>${issueHtml(iss)}${!endOK ? `<br>👉 ${punctRule(tk.frame)}` : ''}`);
      }
    } else {
      const dg = diagnose(v, tk.x, tk.target); onWrong(tk, dg.issues);
      let extra = '';
      if (dg.spell && dg.spell.length) extra += `<br>🔤 Check: ${dg.spell.map(([a]) => `<b>“${esc(a)}”</b>`).join(', ')}`;
      if (tk.attempts >= 3) extra += `<br>📖 Answer: <b>${esc(tk.target)}</b> — type it to continue.`;
      else if (tk.attempts >= 2) extra += `<br>💡 Hint: ${esc(tk.frame)} <b>${esc(embed(tk.x, 'if').split(' ').slice(0, 2).join(' '))}</b> …`;
      fb('bad', issueHtml(dg.issues, extra));
    }
  };
  $('#tChk').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ---------- ORDER WORDS (Level 2) ---------- */
function orderBody(tk) {
  return `<div class="q-say">👻 “The magic words are all mixed up! Put them in order.”</div>
    <div class="q-instr">🧩 Tap the words to build a correct embedded question sentence. The hidden question asks for ${askAbout(tk.x)}.</div>
    <div class="tiles answer" id="oAns"></div>
    <div class="tiles" id="oPool">${tk.shuffled.map((w, i) => `<button class="tile" data-i="${i}">${esc(w)}</button>`).join('')}</div>
    <div class="row btn-row"><button class="btn ghost small" id="oReset">↺ Reset</button><button class="btn small" id="oChk">Check ✓</button></div>`;
}
function bindOrder(tk) {
  const ans = [];
  const draw = () => {
    $('#oAns').innerHTML = ans.map((i, k) => `<button class="tile ans" data-k="${k}">${esc(tk.shuffled[i])}</button>`).join('');
    document.querySelectorAll('#oPool .tile').forEach(b => b.classList.toggle('used', ans.includes(+b.dataset.i)));
    document.querySelectorAll('#oAns .tile').forEach(b => b.onclick = () => { if (tk.solved) return; ans.splice(+b.dataset.k, 1); SFX.click(); draw(); });
  };
  document.querySelectorAll('#oPool .tile').forEach(b => b.onclick = () => { if (tk.solved) return; const i = +b.dataset.i; if (!ans.includes(i)) { ans.push(i); SFX.click(); draw(); } });
  $('#oReset').onclick = () => { if (tk.solved) return; ans.length = 0; draw(); };
  $('#oChk').onclick = () => {
    if (tk.solved) return;
    if (ans.length < tk.toks.length) { fb('info', '🧩 Use all the words first.'); return; }
    const built = ans.map(i => tk.shuffled[i]).join(' ').replace(/ ([?.])$/, '$1');
    if (built === tk.target) {
      const pts = onCorrect(tk); fb('good', `🎉 Correct! <b>${esc(tk.target)}</b>${pts}<div style="margin-top:6px">${ruleFor(tk.x)}</div>`); speak(tk.target, { rate: .9 }); continueBtn('Unlock 🔓');
    } else {
      const dg = diagnose(built, tk.x, tk.target);
      let iss = dg.issues.filter(k => k !== 'spell');
      if (canon(built) === canon(tk.target)) iss = ['punct'];
      if (!iss.length) iss = ['other'];
      onWrong(tk, iss);
      let extra = '';
      if (tk.attempts >= 2) extra = `<br>💡 Hint: start with “<b>${esc(tk.toks.slice(0, tk.frame.split(' ').length + 1).join(' '))}</b> …”`;
      if (tk.attempts >= 3) extra = `<br>📖 Answer: <b>${esc(tk.target)}</b> — build it to continue.`;
      fb('bad', issueHtml(iss, extra));
    }
  };
  draw();
}

/* ---------- CHOICE (Level 3: mcq, fix, dialog) ---------- */
function choiceBody(tk) {
  let top = '';
  if (tk.type === 'mcq') top = `<div class="q-say">🧪 “Choose the right word to add this ingredient to the potion!”</div>
    <div class="q-instr">🔮 Choose the correct word. Hint: the hidden question asks for ${askAbout(tk.x)}.</div>
    <div class="big-sentence">${esc(tk.blanked).replace('____', '<span style="color:#ffc83d">_____</span>')}</div>`;
  else if (tk.type === 'fix') top = `<div class="q-say">🧪 “This spell is broken! Which sentence fixes it?”</div>
    <div class="big-sentence" style="color:#ff9aab">✘ ${esc(tk.wrong)}</div>
    <div class="q-instr">🛠️ The sentence above has the wrong word order. Which option fixes it best? (Original question: “${esc(tk.x.d)}”)</div>`;
  else top = `<div class="q-say">${Q.s.kind === 'mirror' ? '🪞' : '🧙‍♀️'} <span class="en">“${esc(tk.npc)}”</span> <button class="btn ghost small" id="cHear" style="padding:4px 10px">🔊</button></div>
    <div class="q-instr">💬 You want to ask: <b>“${esc(tk.x.d)}”</b> — choose the sentence that is <b>polite and grammatically correct</b>.</div>`;
  return `${top}<div class="opts">${tk.opts.map((o, i) => `<button class="opt" data-i="${i}">${String.fromCharCode(65 + i)}. ${esc(o)}</button>`).join('')}</div>`;
}
function bindChoice(tk) {
  if ($('#cHear')) $('#cHear').onclick = () => speak(tk.npc, { pitch: .7, rate: .9 });
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (tk.solved) return;
    const o = tk.opts[+b.dataset.i];
    if (o === tk.answer) {
      b.classList.add('right'); document.querySelectorAll('.opt').forEach(x => x.disabled = true);
      const pts = onCorrect(tk);
      let more = '';
      if (tk.type === 'mcq') more = `<b>${esc(tk.full)}</b>`;
      if (tk.type === 'dialog') { more = `${Q.s.kind === 'mirror' ? '🪞' : '🧙‍♀️'} “${esc(tk.reply)}”`; speak(tk.reply, { pitch: .7, rate: .9 }); }
      else speak(tk.type === 'mcq' ? tk.full : tk.answer, { rate: .9 });
      fb('good', `🎉 Correct! ${more}${pts}<div style="margin-top:6px">${ruleFor(tk.x)}${tk.type === 'fix' ? '<br>✒️ ' + punctRule(tk.frame) : ''}</div>`);
      continueBtn(tk.type === 'dialog' ? 'Thank you! ➜' : 'Add the ingredient 🧪');
    } else {
      b.classList.add('wrong'); b.disabled = true;
      let iss;
      if (tk.type === 'mcq') iss = [tk.x.yn ? 'ifw' : 'wh'];
      else if (o.slice(-1) !== tk.answer.slice(-1) && canon(o) === canon(tk.answer)) iss = ['punct'];
      else if (canon(o).includes(canon(tk.x.dl)) || /^tell me/i.test(o)) iss = ['order'];
      else iss = [tk.x.yn ? 'ifw' : 'wh'];
      onWrong(tk, iss);
      let extra = '';
      if (iss[0] === 'punct') extra = `<br>👉 ${punctRule(tk.frame)}`;
      if (/ that /.test(o) && tk.type === 'mcq') extra = '<br>👉 “that” introduces a fact, not a question — use a Wh-word or if / whether.';
      if (/^tell me/i.test(o)) extra += '<br>👉 “Tell me …!” is a command — it isn’t polite, and the word order is wrong.';
      fb('bad', issueHtml(iss, extra));
    }
  });
}

function bindQuestion(tk) {
  if (tk.type === 'speak') bindSpeak(tk);
  else if (tk.type === 'blank') bindBlank(tk);
  else if (tk.type === 'type') bindType(tk);
  else if (tk.type === 'order') bindOrder(tk);
  else bindChoice(tk);
  if (tk.solved) continueBtn();
}

/* =========================================================
   BOOT
   ========================================================= */
function boot() {
  if (!window.THREE) { document.body.innerHTML = '<div style="padding:30px;color:#fff;font-family:sans-serif">Could not load the 3D engine. Please check your internet connection and refresh.</div>'; return; }
  initThree(); createPlayer(); setupPointer();
  $('#btnRules').onclick = () => { if (G.state === 'play') rulesScreen(); };
  $('#btnPause').onclick = () => { if (G.state === 'play') pauseMenu(); };
  $('#btnSound').onclick = () => { muted = !muted; $('#btnSound').textContent = muted ? '🔇' : '🔊'; if (muted) try { speechSynthesis.cancel(); } catch (e) { } };
  document.addEventListener('pointerdown', () => ac(), { once: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pauseMenu(); });
  buildLevel(1);
  titleScreen();
  loop();
}
boot();

</script>
</body>
</html>
